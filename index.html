<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声リピート連結ツール (Audio Sequencer)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .drag-over {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-repeat text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-tight">音声リピート結合ツール</h1>
                    <p class="text-xs text-slate-500">指定回数リピートした1本の音声ファイルを作成</p>
                </div>
            </div>
            <span class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-100">
                最大10ファイル対応
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 mt-8 space-y-6">

        <!-- Dropzone / Upload Area -->
        <div id="dropzone" class="border-2 border-dashed border-slate-300 bg-white rounded-2xl p-8 text-center transition-all cursor-pointer hover:border-indigo-400 hover:bg-slate-50/50 shadow-sm">
            <input type="file" id="fileInput" multiple accept="audio/*,video/*,.mp4,.m4v,.mov,.webm,.mp3,.wav,.ogg,.m4a,.aac,.flac" class="hidden">
            <div class="flex flex-col items-center justify-center space-y-3">
                <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-2xl mb-1">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <div class="text-slate-700 font-medium">
                    音声・動画ファイルをドラッグ＆ドロップ または <span class="text-indigo-600 font-semibold underline">ファイルを選択</span>
                </div>
                <p class="text-xs text-slate-400">MP3, WAV, AAC, M4A, MP4/MOV(動画から音声自動抽出) 対応（最大10ファイル）</p>
            </div>
        </div>

        <!-- Global Batch Repeat Controls -->
        <div id="batchControl" class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm hidden flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-sliders text-indigo-600"></i>
                <span class="text-sm font-semibold text-slate-700">一括操作:</span>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-500">リピート数:</span>
                    <div class="flex items-center bg-slate-100 rounded-lg p-1 border border-slate-200">
                        <button onclick="applyBatchRepeat(-1)" class="w-7 h-7 bg-white rounded text-slate-600 hover:bg-slate-200 flex items-center justify-center shadow-xs text-xs font-bold">-</button>
                        <span id="batchCountDisplay" class="px-3 text-sm font-bold text-slate-800">3</span>
                        <button onclick="applyBatchRepeat(1)" class="w-7 h-7 bg-white rounded text-slate-600 hover:bg-slate-200 flex items-center justify-center shadow-xs text-xs font-bold">+</button>
                    </div>
                    <button onclick="applyBatchToAll()" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                        全員に適用
                    </button>
                </div>

                <!-- 数字順ソートボタン -->
                <button onclick="sortByNumber()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-1 border border-slate-200">
                    <i class="fa-solid fa-arrow-down-1-9 text-indigo-600"></i>
                    <span>数字順に並べ替え</span>
                </button>
            </div>
        </div>

        <!-- Audio File List -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-6 py-4 bg-slate-50/50 border-b border-slate-200 flex justify-between items-center">
                <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-list-ol text-slate-500"></i> 登録されたファイル一覧 (<span id="fileCount">0</span>/10)
                </h2>
                <button id="clearAllBtn" onclick="clearAllFiles()" class="text-xs text-red-500 hover:text-red-700 font-medium hidden">
                    <i class="fa-solid fa-trash-can mr-1"></i>すべて消去
                </button>
            </div>

            <div id="fileList" class="divide-y divide-slate-100">
                <!-- Empty state -->
                <div id="emptyState" class="p-8 text-center text-slate-400">
                    <i class="fa-solid fa-music text-3xl mb-2 block opacity-40"></i>
                    <p class="text-sm">ファイルが追加されていません。</p>
                </div>
            </div>
        </div>

        <!-- Action & Progress Panel -->
        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="space-y-1">
                    <div class="flex items-center space-x-4">
                        <div>
                            <div class="text-xs text-slate-500">結合後の予想長さ:</div>
                            <div id="totalDurationText" class="text-lg font-bold text-slate-800">00:00</div>
                        </div>
                        <div class="border-l border-slate-200 pl-4">
                            <div class="text-xs text-slate-500">結合後の推定容量:</div>
                            <div id="totalSizeText" class="text-lg font-bold text-indigo-600">0 MB</div>
                        </div>
                    </div>
                </div>
                <button id="generateBtn" onclick="processAudio()" disabled class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold px-8 py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-bolt"></i>
                    <span>音声ファイルを結合・生成する</span>
                </button>
            </div>

            <!-- Progress bar -->
            <div id="progressContainer" class="hidden space-y-2 pt-2 border-t border-slate-100">
                <div class="flex justify-between text-xs font-semibold text-slate-600">
                    <span id="statusText">音声データを処理中...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                    <div id="progressBar" class="bg-indigo-600 h-full w-0 transition-all duration-200"></div>
                </div>
            </div>
        </div>

        <!-- Result & Player Section -->
        <div id="resultSection" class="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 shadow-sm hidden space-y-4">
            <div class="flex items-center space-x-3 text-emerald-800 font-bold">
                <i class="fa-solid fa-circle-check text-emerald-600 text-xl"></i>
                <span>結合が完了しました！</span>
            </div>

            <!-- Audio Player -->
            <div class="bg-white p-3 rounded-xl border border-emerald-100 shadow-xs">
                <audio id="audioPreview" controls class="w-full h-10"></audio>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 pt-2">
                <div class="text-xs text-emerald-700" id="resultInfo">
                    WAV形式 / 高音質ステレオ
                </div>
                <a id="downloadBtn" download="combined_repeat_audio.wav" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-xl shadow transition flex items-center justify-center space-x-2 text-sm">
                    <i class="fa-solid fa-download"></i>
                    <span>ファイルをダウンロード (.wav)</span>
                </a>
            </div>
        </div>

        <!-- Toast Notifications Container -->
        <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2"></div>
    </main>

    <script>
        // State variables
        const MAX_FILES = 10;
        let audioFiles = []; // Array of { id, file, name, duration, repeatCount, buffer, speed, speedsPerRepeat, showDetails }
        let batchRepeatValue = 3;
        let audioContext = null;

        // UI Elements
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const emptyState = document.getElementById('emptyState');
        const fileCountSpan = document.getElementById('fileCount');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const generateBtn = document.getElementById('generateBtn');
        const batchControl = document.getElementById('batchControl');
        const batchCountDisplay = document.getElementById('batchCountDisplay');
        const totalDurationText = document.getElementById('totalDurationText');
        const totalSizeText = document.getElementById('totalSizeText');

        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const statusText = document.getElementById('statusText');

        const resultSection = document.getElementById('resultSection');
        const audioPreview = document.getElementById('audioPreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultInfo = document.getElementById('resultInfo');

        function getAudioContext() {
            if (!audioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContextClass();
            }
            return audioContext;
        }

        // Initialize Drag and Drop Events
        dropzone.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropzone.classList.add('drag-over');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropzone.classList.remove('drag-over');
            }, false);
        });

        dropzone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            fileInput.value = ''; // Reset input
        });

        async function handleFiles(files) {
            const incoming = Array.from(files).filter(f => 
                f.type.startsWith('audio/') || 
                f.type.startsWith('video/') || 
                f.name.match(/\.(mp3|wav|ogg|m4a|aac|flac|mp4|m4v|mov|webm|mkv)$/i)
            );
            
            if (incoming.length === 0) {
                showToast('有効な音声または動画ファイルを選択してください。', 'warning');
                return;
            }

            if (audioFiles.length + incoming.length > MAX_FILES) {
                showToast(`ファイルは最大${MAX_FILES}個までしか追加できません。`, 'warning');
            }

            const availableSlots = MAX_FILES - audioFiles.length;
            const filesToProcess = incoming.slice(0, availableSlots);

            for (const file of filesToProcess) {
                try {
                    const id = 'file_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                    const arrayBuffer = await file.arrayBuffer();
                    const ctx = getAudioContext();
                    
                    // Decode audio track directly from file (handles MP4/Video audio streams)
                    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);

                    const isVideo = file.type.startsWith('video/') || file.name.match(/\.(mp4|m4v|mov|webm|mkv)$/i);
                    const initialRepeat = batchRepeatValue;
                    
                    audioFiles.push({
                        id,
                        file,
                        name: file.name,
                        duration: audioBuffer.duration,
                        repeatCount: initialRepeat,
                        speed: 1.0,
                        speedsPerRepeat: Array(initialRepeat).fill(1.0),
                        showDetails: false,
                        buffer: audioBuffer,
                        isVideo: !!isVideo
                    });
                } catch (err) {
                    console.error('Audio decode error:', err);
                    showToast(`"${file.name}" からの音声抽出・読み込みに失敗しました。`, 'error');
                }
            }

            renderFileList();
            updateTotalInfo();
            resultSection.classList.add('hidden');
        }

        // 数字順ソート機能
        function sortByNumber() {
            audioFiles.sort((a, b) => {
                const getNum = (str) => {
                    const match = str.match(/\d+/g);
                    return match ? match.map(Number) : [];
                };

                const numA = getNum(a.name);
                const numB = getNum(b.name);

                if (numA.length === 0 && numB.length === 0) {
                    return a.name.localeCompare(b.name, undefined, { numeric: true });
                }
                if (numA.length === 0) return 1;
                if (numB.length === 0) return -1;

                for (let i = 0; i < Math.max(numA.length, numB.length); i++) {
                    if (numA[i] === undefined) return -1;
                    if (numB[i] === undefined) return 1;
                    if (numA[i] !== numB[i]) return numA[i] - numB[i];
                }

                return a.name.localeCompare(b.name, undefined, { numeric: true });
            });

            renderFileList();
            updateTotalInfo();
            showToast('ファイルを数字順に並べ替えました。', 'info');
        }

        function calculateFileDurationAndSize(item) {
            let itemDuration = 0;
            for (let r = 0; r < item.repeatCount; r++) {
                const speed = item.speedsPerRepeat[r] || item.speed || 1.0;
                itemDuration += item.duration / speed;
            }
            // 44.1kHz / 16bit / Stereo WAV: 44100 * 2ch * 2bytes = 176,400 bytes/sec + 44bytes header
            const estimatedBytes = Math.ceil(itemDuration * 44100 * 4) + 44;
            return { duration: itemDuration, bytes: estimatedBytes };
        }

        function renderFileList() {
            fileCountSpan.textContent = audioFiles.length;

            if (audioFiles.length > 0) {
                emptyState.classList.add('hidden');
                clearAllBtn.classList.remove('hidden');
                batchControl.classList.remove('hidden');
                generateBtn.disabled = false;
            } else {
                emptyState.classList.remove('hidden');
                clearAllBtn.classList.add('hidden');
                batchControl.classList.add('hidden');
                generateBtn.disabled = true;
            }

            // Remove existing item elements
            const existingItems = fileList.querySelectorAll('.file-item');
            existingItems.forEach(item => item.remove());

            audioFiles.forEach((item, index) => {
                const calc = calculateFileDurationAndSize(item);
                const sizeInMB = (calc.bytes / (1024 * 1024)).toFixed(2);

                const row = document.createElement('div');
                row.className = 'file-item p-4 flex flex-col border-b border-slate-100 hover:bg-slate-50/50 transition';
                row.dataset.id = item.id;

                let speedsHtml = '';
                if (item.showDetails) {
                    speedsHtml = `
                        <div class="mt-3 pt-3 border-t border-slate-200 bg-slate-50/80 p-3 rounded-xl space-y-2">
                            <div class="text-xs font-semibold text-slate-600 mb-1 flex justify-between items-center">
                                <span><i class="fa-solid fa-clock-rotate-left text-indigo-500 mr-1"></i> 回数ごとの速度指定</span>
                                <span class="text-slate-400 font-normal">（1回ずつ個別に速度を設定できます）</span>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                                ${item.speedsPerRepeat.map((spd, rIdx) => `
                                    <div class="flex items-center justify-between bg-white p-2 rounded-lg border border-slate-200 text-xs">
                                        <span class="font-medium text-slate-600">${rIdx + 1}回目:</span>
                                        <div class="flex items-center space-x-1">
                                            <input type="number" step="0.1" min="0.2" max="3.0" value="${spd}" 
                                                onchange="updateSingleSpeed('${item.id}', ${rIdx}, this.value)"
                                                class="w-14 px-1.5 py-0.5 border border-slate-300 rounded text-center font-bold text-slate-800 bg-slate-50">
                                            <span class="text-slate-500">x</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                const isVideoBadge = item.isVideo ? `<span class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-1.5 py-0.5 rounded shrink-0 mr-1.5"><i class="fa-solid fa-video text-[9px] mr-1"></i>MP4音声</span>` : '';

                row.innerHTML = `
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                        <div class="flex items-center space-x-3 w-full sm:w-auto overflow-hidden">
                            <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 text-xs font-bold flex items-center justify-center shrink-0">
                                ${index + 1}
                            </span>
                            <div class="truncate">
                                <div class="text-sm font-semibold text-slate-800 truncate flex items-center" title="${item.name}">
                                    ${isVideoBadge}
                                    <span class="truncate">${item.name}</span>
                                </div>
                                <div class="text-xs text-slate-400 flex items-center gap-2">
                                    <span>原音: ${formatTime(item.duration)}</span>
                                    <span>•</span>
                                    <span class="text-indigo-600 font-medium">予想: ${formatTime(calc.duration)} (${sizeInMB} MB)</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center justify-between sm:justify-end w-full sm:w-auto gap-3 border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-100">
                            <!-- Global Speed for file -->
                            <div class="flex items-center space-x-1.5">
                                <span class="text-xs text-slate-500">基本速度:</span>
                                <select onchange="updateBaseSpeed('${item.id}', this.value)" class="bg-slate-100 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 px-2 py-1">
                                    ${[0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0].map(s => `
                                        <option value="${s}" ${item.speed == s ? 'selected' : ''}>${s}x</option>
                                    `).join('')}
                                </select>
                            </div>

                            <!-- Repeat Counter -->
                            <div class="flex items-center space-x-2">
                                <span class="text-xs text-slate-500">リピート:</span>
                                <div class="flex items-center bg-slate-100 rounded-lg p-1 border border-slate-200">
                                    <button onclick="updateRepeat('${item.id}', -1)" class="w-6 h-6 bg-white rounded text-slate-600 hover:bg-slate-200 flex items-center justify-center text-xs font-bold">-</button>
                                    <span class="px-2 text-xs font-bold text-slate-800">${item.repeatCount}回</span>
                                    <button onclick="updateRepeat('${item.id}', 1)" class="w-6 h-6 bg-white rounded text-slate-600 hover:bg-slate-200 flex items-center justify-center text-xs font-bold">+</button>
                                </div>
                            </div>

                            <!-- Detail Toggle Button -->
                            <button onclick="toggleDetails('${item.id}')" class="text-xs font-semibold px-2.5 py-1 rounded-lg border transition ${item.showDetails ? 'bg-indigo-50 text-indigo-600 border-indigo-200' : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'} flex items-center space-x-1">
                                <i class="fa-solid fa-sliders text-xs"></i>
                                <span>詳細</span>
                            </button>

                            <!-- Reorder & Delete Controls -->
                            <div class="flex items-center space-x-1">
                                <button onclick="moveItem(${index}, -1)" ${index === 0 ? 'disabled' : ''} class="p-1.5 text-slate-400 hover:text-slate-600 disabled:opacity-30 disabled:hover:text-slate-400">
                                    <i class="fa-solid fa-chevron-up text-xs"></i>
                                </button>
                                <button onclick="moveItem(${index}, 1)" ${index === audioFiles.length - 1 ? 'disabled' : ''} class="p-1.5 text-slate-400 hover:text-slate-600 disabled:opacity-30 disabled:hover:text-slate-400">
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </button>
                                <button onclick="removeItem('${item.id}')" class="p-1.5 text-red-400 hover:text-red-600 ml-1">
                                    <i class="fa-solid fa-xmark text-sm"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    ${speedsHtml}
                `;
                fileList.appendChild(row);
            });
        }

        function updateRepeat(id, delta) {
            const item = audioFiles.find(f => f.id === id);
            if (item) {
                const newCount = Math.max(1, item.repeatCount + delta);
                item.repeatCount = newCount;
                
                // Adjust speedsPerRepeat array length
                while (item.speedsPerRepeat.length < newCount) {
                    item.speedsPerRepeat.push(item.speed);
                }
                item.speedsPerRepeat = item.speedsPerRepeat.slice(0, newCount);

                renderFileList();
                updateTotalInfo();
            }
        }

        function updateBaseSpeed(id, val) {
            const item = audioFiles.find(f => f.id === id);
            if (item) {
                const speed = parseFloat(val);
                item.speed = speed;
                item.speedsPerRepeat = Array(item.repeatCount).fill(speed);
                renderFileList();
                updateTotalInfo();
            }
        }

        function updateSingleSpeed(id, repeatIndex, val) {
            const item = audioFiles.find(f => f.id === id);
            if (item) {
                const speed = Math.max(0.1, parseFloat(val) || 1.0);
                item.speedsPerRepeat[repeatIndex] = speed;
                updateTotalInfo();
            }
        }

        function toggleDetails(id) {
            const item = audioFiles.find(f => f.id === id);
            if (item) {
                item.showDetails = !item.showDetails;
                renderFileList();
            }
        }

        function applyBatchRepeat(delta) {
            batchRepeatValue = Math.max(1, batchRepeatValue + delta);
            batchCountDisplay.textContent = batchRepeatValue;
        }

        function applyBatchToAll() {
            audioFiles.forEach(f => {
                f.repeatCount = batchRepeatValue;
                f.speedsPerRepeat = Array(batchRepeatValue).fill(f.speed);
            });
            renderFileList();
            updateTotalInfo();
            showToast(`すべてのリピート回数を ${batchRepeatValue} 回に変更しました。`, 'info');
        }

        function moveItem(index, direction) {
            const targetIndex = index + direction;
            if (targetIndex >= 0 && targetIndex < audioFiles.length) {
                const temp = audioFiles[index];
                audioFiles[index] = audioFiles[targetIndex];
                audioFiles[targetIndex] = temp;
                renderFileList();
            }
        }

        function removeItem(id) {
            audioFiles = audioFiles.filter(f => f.id !== id);
            renderFileList();
            updateTotalInfo();
            resultSection.classList.add('hidden');
        }

        function clearAllFiles() {
            audioFiles = [];
            renderFileList();
            updateTotalInfo();
            resultSection.classList.add('hidden');
        }

        function updateTotalInfo() {
            let totalSeconds = 0;
            let totalBytes = 0;

            audioFiles.forEach(f => {
                const calc = calculateFileDurationAndSize(f);
                totalSeconds += calc.duration;
                totalBytes += calc.bytes;
            });

            totalDurationText.textContent = formatTime(totalSeconds);
            const totalMB = (totalBytes / (1024 * 1024)).toFixed(2);
            totalSizeText.textContent = `${totalMB} MB`;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        async function processAudio() {
            if (audioFiles.length === 0) return;

            // UI state updates
            generateBtn.disabled = true;
            progressContainer.classList.remove('hidden');
            resultSection.classList.add('hidden');
            updateProgress(5, "オーディオバッファの計算中...");

            await new Promise(r => setTimeout(r, 100)); // UI tick

            try {
                const targetSampleRate = 44100; // Standard CD quality sample rate
                let totalDuration = 0;

                // Calculate total duration considering custom speed for each repeat
                audioFiles.forEach(item => {
                    for (let r = 0; r < item.repeatCount; r++) {
                        const speed = item.speedsPerRepeat[r] || item.speed || 1.0;
                        totalDuration += item.duration / speed;
                    }
                });

                const totalSamples = Math.ceil(totalDuration * targetSampleRate);

                updateProgress(20, "結合バッファを作成中...");
                const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, totalSamples, targetSampleRate);

                let currentOffset = 0;

                // Copy audio data iteratively based on sequence, repeat count, and speed
                for (let i = 0; i < audioFiles.length; i++) {
                    const item = audioFiles[i];
                    const progressVal = 20 + Math.floor((i / audioFiles.length) * 55);
                    updateProgress(progressVal, `"${item.name}" を処理中...`);

                    for (let r = 0; r < item.repeatCount; r++) {
                        const speed = item.speedsPerRepeat[r] || item.speed || 1.0;
                        const bufferSource = offlineCtx.createBufferSource();
                        bufferSource.buffer = item.buffer;
                        bufferSource.playbackRate.value = speed; // Set playback speed
                        bufferSource.connect(offlineCtx.destination);
                        
                        bufferSource.start(currentOffset);
                        currentOffset += item.duration / speed;
                    }
                }

                updateProgress(80, "オーディオのレンダリング中...");
                const renderedBuffer = await offlineCtx.startRendering();

                updateProgress(92, "WAVファイル形式にエンコード中...");
                await new Promise(r => setTimeout(r, 50));

                const wavBlob = audioBufferToWavBlob(renderedBuffer);
                const audioUrl = URL.createObjectURL(wavBlob);

                // Set preview and download link
                audioPreview.src = audioUrl;
                downloadBtn.href = audioUrl;
                downloadBtn.download = `combined_repeat_${Date.now()}.wav`;

                const sizeInMB = (wavBlob.size / (1024 * 1024)).toFixed(2);
                resultInfo.textContent = `フォーマット: WAV (16-bit PCM) / 長さ: ${formatTime(renderedBuffer.duration)} / サイズ: ${sizeInMB} MB`;

                updateProgress(100, "完了!");
                setTimeout(() => {
                    progressContainer.classList.add('hidden');
                    resultSection.classList.remove('hidden');
                    generateBtn.disabled = false;
                }, 500);

            } catch (err) {
                console.error("Audio processing failed:", err);
                showToast("音声結合処理中にエラーが発生しました。", "error");
                progressContainer.classList.add('hidden');
                generateBtn.disabled = false;
            }
        }

        function updateProgress(percent, statusMsg) {
            progressBar.style.width = percent + '%';
            progressPercent.textContent = percent + '%';
            if (statusMsg) statusText.textContent = statusMsg;
        }

        // Convert AudioBuffer to WAV format Blob
        function audioBufferToWavBlob(buffer) {
            const numOfChan = buffer.numberOfChannels;
            const length = buffer.length * numOfChan * 2 + 44;
            const out = new DataView(new ArrayBuffer(length));
            const channels = [];
            let sample = 0;
            let offset = 0;
            let pos = 0;

            function setUint16(data) {
                out.setUint16(pos, data, true);
                pos += 2;
            }

            function setUint32(data) {
                out.setUint32(pos, data, true);
                pos += 4;
            }

            // RIFF header
            setUint32(0x46464952); // "RIFF"
            setUint32(length - 8); // file length - 8
            setUint32(0x45564157); // "WAVE"

            // fmt chunk
            setUint32(0x20746d66); // "fmt " chunk
            setUint32(16);         // length = 16
            setUint16(1);          // PCM (uncompressed)
            setUint16(numOfChan);
            setUint32(buffer.sampleRate);
            setUint32(buffer.sampleRate * 2 * numOfChan); // avg bytes/sec
            setUint16(numOfChan * 2);                      // block align
            setUint16(16);                                 // 16-bit

            // data chunk
            setUint32(0x61746164); // "data" chunk
            setUint32(length - pos - 4);

            for (let i = 0; i < numOfChan; i++) {
                channels.push(buffer.getChannelData(i));
            }

            while (pos < length) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    out.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }

            return new Blob([out], { type: "audio/wav" });
        }

        // Notification Toast function
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-600' : type === 'warning' ? 'bg-amber-500' : 'bg-slate-800';
            toast.className = `${bgColor} text-white text-xs px-4 py-3 rounded-xl shadow-lg flex items-center justify-between space-x-3 transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `
                <span>${message}</span>
                <button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;
            const container = document.getElementById('toastContainer');
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
